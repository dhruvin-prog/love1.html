<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>To My Love 💌</title>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(135deg, #ffe3e3, #ffc9de);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      overflow-x: hidden;
    }

    h1 {
      font-family: 'Great Vibes', cursive;
      font-size: 3rem;
      color: #d63384;
      margin-bottom: 20px;
    }

    .envelope {
      position: relative;
      width: 300px;
      height: 200px;
      background: linear-gradient(to bottom, #ffafcc, #ffc8dd);
      border-radius: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
      cursor: pointer;
      overflow: hidden;
      transition: transform 0.3s ease;
    }

    .envelope:hover {
      transform: scale(1.05);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 50%;
      background: #ffb3c1;
      transform-origin: top;
      transition: transform 0.6s ease;
      z-index: 2;
    }

    .letter {
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      width: 280px;
      background: #fff0f6;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.15);
      font-size: 1rem;
      text-align: center;
      z-index: 1;
      opacity: 0;
      transition: top 0.8s ease, opacity 0.8s ease;
    }

    .letter img {
      width: 100%;
      border-radius: 8px;
      margin-top: 12px;
    }

    .hearts {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .heart {
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 105, 180, 0.7);
      transform: rotate(45deg);
      animation: floatUp 8s infinite ease-in;
      border-radius: 4px;
    }

    .heart::before,
    .heart::after {
      content: "";
      position: absolute;
      width: 20px;
      height: 20px;
      background: rgba(255, 105, 180, 0.7);
      border-radius: 50%;
    }

    .heart::before {
      top: -10px;
      left: 0;
    }

    .heart::after {
      top: 0;
      left: -10px;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(45deg);
        opacity: 1;
      }
      100% {
        transform: translateY(-10vh) rotate(45deg);
        opacity: 0;
      }
    }

    @media (max-width: 600px) {
      h1 {
        font-size: 2rem;
      }
      .envelope {
        width: 90%;
        height: 180px;
      }
      .letter {
        width: 90%;
        font-size: 0.95rem;
      }
    }
  </style>
</head>
<body>
  <h1>My Love 💖</h1>

  <div class="envelope" onclick="showNextLetter()">
    <div class="flap" id="flap"></div>
  </div>

  <div class="letter" id="letter1">
    I'm really sorry for any hurt I caused. You're my everything and I never want to lose you. 💔
  </div>
  <div class="letter" id="letter2">
    Here’s one of my favorite memories with you: <br>
    <img src="https://placekitten.com/300/200" alt="Your Photo">
  </div>
  <div class="letter" id="letter3">
    And here's another photo that makes me smile 😊 <br>
    <img src="https://placekitten.com/301/200" alt="Your Photo">
  </div>
  <div class="letter" id="letter4">
    I love you more every single day. You make my world brighter and my heart fuller. ❤️
  </div>

  <audio autoplay loop>
    <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mp3" />
    Your browser does not support the audio element.
  </audio>

  <div class="hearts" id="hearts"></div>

  <script>
    let currentLetter = 1;
    function showNextLetter() {
      const flap = document.getElementById('flap');
      flap.style.transform = "rotateX(-180deg)";

      // Hide all letters first
      for (let i = 1; i <= 4; i++) {
        const oldLetter = document.getElementById(`letter${i}`);
        if (oldLetter) {
          oldLetter.style.opacity = "0";
          oldLetter.style.top = "100%";
        }
      }

      // Show current letter
      const letter = document.getElementById(`letter${currentLetter}`);
      if (letter) {
        letter.style.top = "120%";
        letter.style.opacity = "1";
        currentLetter++;
      }
    }

    // Floating hearts
    const heartsContainer = document.getElementById("hearts");
    for (let i = 0; i < 25; i++) {
      const heart = document.createElement("div");
      heart.classList.add("heart");
      heart.style.left = Math.random() * 100 + "vw";
      heart.style.animationDuration = (5 + Math.random() * 5) + "s";
      heart.style.animationDelay = Math.random() * 5 + "s";
      heartsContainer.appendChild(heart);
    }
  </script>
</body>
</html>
